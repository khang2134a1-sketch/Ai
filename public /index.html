<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude.ai by MHL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #2b2b2b; color: #ececec; }
    
    /* Sidebar */
    #sidebar { width: 260px; background-color: #1e1e1e; display: flex; flex-direction: column; border-right: 1px solid #333; }
    .sidebar-header { padding: 15px; font-weight: bold; font-size: 1.1rem; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
    .new-chat-btn { background: #d97757; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; width: calc(100% - 30px); margin: 15px; text-align: center; }
    .new-chat-btn:hover { background: #c86545; }
    .history-list { flex: 1; overflow-y: auto; padding: 0 15px; }
    .history-item { padding: 10px; margin-bottom: 6px; background: #2a2a2a; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.9rem; }
    .history-item:hover { background: #3a3a3a; }

    /* Main Chat Area */
    #main { flex: 1; display: flex; flex-direction: column; height: 100vh; }
    .chat-header { padding: 15px 20px; border-bottom: 1px solid #333; background: #252525; display: flex; justify-content: space-between; align-items: center; }
    .brand { font-size: 1.2rem; font-weight: bold; color: #d97757; }
    
    .chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .message { max-width: 80%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; font-size: 0.95rem; }
    .user { background: #3a3a3a; align-self: flex-end; color: #fff; border-bottom-right-radius: 2px; }
    .bot { background: #1e1e1e; align-self: flex-start; color: #e1e1e1; border-bottom-left-radius: 2px; border: 1px solid #333; }
    .loading { font-style: italic; color: #888; }

    /* Input Box */
    .input-container { padding: 20px; background: #252525; border-top: 1px solid #333; display: flex; gap: 10px; }
    textarea { flex: 1; height: 50px; background: #1e1e1e; color: #fff; border: 1px solid #444; border-radius: 8px; padding: 10px; resize: none; outline: none; font-size: 1rem; }
    textarea:focus { border-color: #d97757; }
    button.send-btn { background: #d97757; color: white; border: none; padding: 0 20px; border-radius: 8px; cursor: pointer; font-weight: bold; }
    button.send-btn:hover { background: #c86545; }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div id="sidebar">
    <div class="sidebar-header">
      <span>Claude.ai by MHL</span>
    </div>
    <button class="new-chat-btn" onclick="startNewChat()">+ Đoạn chat mới</button>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- Main Chat Area -->
  <div id="main">
    <div class="chat-header">
      <div class="brand">Claude.ai <span style="font-size: 0.8rem; color: #aaa;">by MHL</span></div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="message bot">Xin chào! Tôi là Claude (by MHL). Bạn cần tôi giúp gì hôm nay?</div>
    </div>

    <div class="input-container">
      <textarea id="userInput" placeholder="Nhập câu hỏi của bạn tại đây..." onkeydown="handleKeyDown(event)"></textarea>
      <button class="send-btn" onclick="sendMessage()">Gửi</button>
    </div>
  </div>

  <script>
    let currentChatId = Date.now().toString();
    let chatHistory = JSON.parse(localStorage.getItem('mhl_chat_history') || '{}');

    window.onload = () => {
      renderSidebar();
    };

    function renderSidebar() {
      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';
      const keys = Object.keys(chatHistory).sort((a, b) => b - a);

      keys.forEach(id => {
        const item = document.createElement('div');
        item.className = 'history-item';
        const firstMsg = chatHistory[id][0]?.content || 'Đoạn chat mới';
        item.innerText = firstMsg;
        item.onclick = () => loadChat(id);
        historyList.appendChild(item);
      });
    }

    function startNewChat() {
      currentChatId = Date.now().toString();
      document.getElementById('chatBox').innerHTML = `<div class="message bot">Xin chào! Tôi là Claude (by MHL). Bạn cần tôi giúp gì hôm nay?</div>`;
    }

    function loadChat(id) {
      currentChatId = id;
      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';
      const messages = chatHistory[id] || [];
      
      messages.forEach(msg => {
        appendMessage(msg.role === 'user' ? 'user' : 'bot', msg.content);
      });
    }

    function appendMessage(role, text) {
      const chatBox = document.getElementById('chatBox');
      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;
      msgDiv.innerText = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    async function sendMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      // Hiển thị câu hỏi của user
      appendMessage('user', text);
      input.value = '';

      // Lưu câu hỏi vào LS
      if (!chatHistory[currentChatId]) chatHistory[currentChatId] = [];
      chatHistory[currentChatId].push({ role: 'user', content: text });
      saveHistory();

      // Tạo hiệu ứng chờ kết quả
      const loadingDiv = appendMessage('bot loading', '⏳ Đang đợi Claude trả lời...');

      try {
        // Gọi API backend (Vercel Serverless Function)
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: chatHistory[currentChatId] })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        // Hiển thị câu trả lời
        loadingDiv.classList.remove('loading');
        loadingDiv.innerText = data.reply;

        // Lưu câu trả lời vào LS
        chatHistory[currentChatId].push({ role: 'assistant', content: data.reply });
        saveHistory();
      } catch (err) {
        loadingDiv.classList.remove('loading');
        loadingDiv.innerText = "❌ Lỗi: " + err.message;
      }
    }

    function saveHistory() {
      localStorage.setItem('mhl_chat_history', JSON.stringify(chatHistory));
      renderSidebar();
    }

    function handleKeyDown(e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    }
  </script>
</body>
</html>
